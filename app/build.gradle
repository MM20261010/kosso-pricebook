plugins { id 'com.android.application' }

def sourceCommit = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.get().trim()
if (!(sourceCommit ==~ /[0-9a-f]{40}/)) throw new GradleException('Missing build source identity')
def sourceDirty = !providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'status', '--porcelain', '--untracked-files=normal'
}.standardOutput.asText.get().trim().isEmpty()
def parserRevision = 'receipt-structure-audit-1'


android {
    namespace 'org.privateprice.pricebook'
    compileSdk 35
    defaultConfig {
        applicationId 'org.privateprice.pricebook'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.8.1-debug-classification'
        buildConfigField 'String', 'SOURCE_COMMIT', '"' + sourceCommit + '"'
        buildConfigField 'String', 'PARSER_REVISION', '"' + parserRevision + '"'
        buildConfigField 'boolean', 'SOURCE_DIRTY', sourceDirty.toString()
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner 'org.privateprice.pricebook.OfflineOcrInstrumentation'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    ndkVersion '27.2.12479018'
    buildFeatures { buildConfig true }
    // Run the same corrupted synthetic OCR/coordinate regression on the JVM and Android.
    sourceSets.androidTest.java.srcDir '../tests/shared'
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/buildIdentityAssets')

    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Open-source local OCR; traineddata is bundled in APK at build time.
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.core:core:1.13.1'
}

// Public build provenance only. No receipt, device, environment path, key or account information.
def identityAssets = layout.buildDirectory.dir('generated/buildIdentityAssets')
tasks.register('writeBuildIdentity') {
    inputs.property('sourceCommit', sourceCommit)
    inputs.property('parserRevision', parserRevision)
    inputs.property('sourceDirty', sourceDirty)
    outputs.dir(identityAssets)
    doLast {
        def output = identityAssets.get().file('build-info.json').asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson([version_code:9, version_name:'0.8.1-debug-classification', source_commit:sourceCommit, working_tree_dirty:sourceDirty, parser_revision:parserRevision]) + '\n'
    }
}
tasks.named('preBuild').configure { dependsOn 'writeBuildIdentity' }
