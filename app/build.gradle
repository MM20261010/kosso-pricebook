plugins { id 'com.android.application' }

android {
    namespace 'org.privateprice.pricebook'
    compileSdk 35
    defaultConfig {
        applicationId 'org.privateprice.pricebook'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-debug-compare'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner 'org.privateprice.pricebook.OfflineOcrInstrumentation'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    ndkVersion '27.2.12479018'
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Open-source local OCR; traineddata is bundled in APK at build time.
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.core:core:1.13.1'
}
