name: Test APK (manual run)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run parser and calculations tests
        run: |
          sh tests/test-price-math.sh
          sh tests/test-parser.sh
          sh tests/privacy-sanity.sh
      - name: Embed offline Japanese and English OCR models
        run: sh scripts/fetch-ocr-models.sh
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: kosso-pricebook-debug-v0.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
